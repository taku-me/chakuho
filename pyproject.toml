[project]
name = "chakuho"
version = "0.1.0"
description = "chakuho (択法): Jev-compatible System One decision endpoint over a local LLM (1-token logprob decisions)"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chakuho = "chakuho.cli:main"

[project.optional-dependencies]
bench = [
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chakuho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
